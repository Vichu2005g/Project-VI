<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Car - Car Inventory</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <header>
        <h1>Car Inventory</h1>
        <nav class="page-nav">
            <a href="/" class="nav-back">&#8592; Back to Home</a>
        </nav>
    </header>

    <section class="form-section">
        <h2 id="form-title">Add New Car</h2>

        <div id="error-message" class="error-message"></div>

        <form id="car-form">
            <div class="form-row">
                <div class="form-group">
                    <label for="make">Make *</label>
                    <input type="text" id="make" required placeholder="Toyota">
                </div>
                <div class="form-group">
                    <label for="model">Model *</label>
                    <input type="text" id="model" required placeholder="Camry">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="year">Year *</label>
                    <input type="number" id="year" min="1886" max="2027" required placeholder="2020">
                </div>
                <div class="form-group">
                    <label for="price">Price ($) *</label>
                    <input type="number" id="price" step="0.01" min="0" required placeholder="25000">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="mileage">Mileage (km) *</label>
                    <input type="number" id="mileage" min="0" required placeholder="50000">
                </div>
                <div class="form-group">
                    <label for="color">Color</label>
                    <input type="text" id="color" placeholder="Blue">
                </div>
            </div>

            <div class="form-group">
                <label for="vin">VIN (Vehicle Identification Number)</label>
                <input type="text" id="vin" maxlength="17" placeholder="17-character VIN">
            </div>

            <div class="form-group">
                <label for="image">Car Image</label>
                <input type="file" id="image" accept="image/*">
                <div style="margin-top:10px;">
                    <img id="image-preview" alt="" style="max-width:240px; display:none; border-radius:8px; border:2px solid #eee;">
                </div>
            </div>

            <div class="button-group">
                <button type="submit" class="btn btn-primary">Save Car</button>
                <button type="button" class="btn btn-secondary" id="cancel-btn">Cancel</button>
            </div>
        </form>
    </section>
</div>

<script src="add-car.js"></script>
</body>
</html>
