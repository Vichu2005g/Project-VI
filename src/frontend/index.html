<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Inventory Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <header>
        <h1>Car Inventory</h1>
        <p>Manage your car listings</p>
        <div class="header-actions">
            <a href="add-car.html" class="btn btn-primary">+ Add Car</a>
            <a href="stats.html" class="btn btn-stats">View Inventory &amp; Stats</a>
        </div>
    </header>

    <section class="list-section">
        <div class="list-header">
            <h2>Recently Added / Updated</h2>
            <button class="btn btn-refresh" id="refresh-btn">Refresh</button>
        </div>

        <div id="loading" class="loading">Loading cars...</div>
        <div id="error-message" class="error-message"></div>

        <div id="cars-container" class="cars-grid"></div>
    </section>
</div>

<script src="home.js"></script>
</body>
</html>
