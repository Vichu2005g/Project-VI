<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory &amp; Stats - Car Inventory</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <header>
        <h1>Inventory &amp; Stats</h1>
        <nav class="page-nav">
            <a href="/" class="nav-back">&#8592; Back to Home</a>
            <a href="add-car.html" class="btn btn-primary btn-sm">+ Add Car</a>
        </nav>
    </header>

    <!-- Stats Dashboard -->
    <section class="stats-section">
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value" id="stat-total">&#8212;</div>
                <div class="stat-label">Total Cars</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="stat-avg-price">&#8212;</div>
                <div class="stat-label">Avg. Price</div>
            </div>
            <div class="stat-card stat-card-wide">
                <div class="stat-label" style="margin-bottom:12px; font-size:1rem; font-weight:600;">Top 5 Models</div>
                <ol id="stat-top-models" class="top-models-list"></ol>
            </div>
        </div>
    </section>

    <!-- Filter & Sort -->
    <section class="filter-section">
        <h2>Filter &amp; Sort Listings</h2>
        <div class="filter-controls">
            <div class="filter-group">
                <label for="filter-make">Make:</label>
                <select id="filter-make"><option value="">All Makes</option></select>
            </div>
            <div class="filter-group">
                <label for="filter-model">Model:</label>
                <select id="filter-model"><option value="">All Models</option></select>
            </div>
            <div class="filter-group">
                <label for="filter-color">Color:</label>
                <select id="filter-color"><option value="">All Colors</option></select>
            </div>
            <div class="filter-group">
                <label for="sort-by">Sort By:</label>
                <select id="sort-by">
                    <option value="">None</option>
                    <option value="price-asc">Price: Low to High</option>
                    <option value="price-desc">Price: High to Low</option>
                    <option value="year-desc">Year: Newest First</option>
                    <option value="year-asc">Year: Oldest First</option>
                    <option value="mileage-asc">Mileage: Low to High</option>
                    <option value="mileage-desc">Mileage: High to Low</option>
                </select>
            </div>
            <button class="btn btn-refresh" id="clear-filters">Clear Filters</button>
        </div>
    </section>

    <!-- Car Listings -->
    <section class="list-section">
        <div class="list-header">
            <h2>Car Inventory</h2>
            <div style="display:flex; align-items:center; gap:15px;">
                <span id="cars-count" class="cars-count-label"></span>
                <button class="btn btn-refresh" id="refresh-btn">Refresh</button>
            </div>
        </div>

        <div id="loading" class="loading">Loading cars...</div>
        <div id="error-message" class="error-message"></div>

        <div id="cars-container" class="cars-grid"></div>
    </section>
</div>

<!-- Car Detail Popup -->
<div id="car-popup" class="modal">
    <div class="modal-content">
        <span class="close" id="popup-close">&times;</span>
        <div id="popup-body"></div>
    </div>
</div>
<!-- Quick Edit Modal PATCH -->
<div id="quick-edit-modal" style="display:none; position:fixed; z-index:2000; 
     left:0; top:0; width:100%; height:100%; background:rgba(0,0,0,0.6);">
    <div style="background:white; margin:10% auto; padding:30px; 
                border-radius:10px; width:90%; max-width:400px;
                box-shadow: 0 10px 40px rgba(0,0,0,0.3);">
        
        <h2 style="color:#333; margin-bottom:5px;"> Quick Edit</h2>
        <p style="color:#888; font-size:0.9rem; margin-bottom:20px;">
            Update partially price and color
        </p>

        <input type="hidden" id="patch-car-id">

        <div style="margin-bottom:15px;">
            <label style="display:block; font-weight:600; 
                          margin-bottom:5px; color:#555;">
                Price ($)
            </label>
            <input type="number" id="patch-price" min="0" step="0.01"
                   style="width:100%; padding:10px; border:2px solid #ddd; 
                          border-radius:5px; font-size:1rem;">
        </div>

        <div style="margin-bottom:20px;">
            <label style="display:block; font-weight:600; 
                          margin-bottom:5px; color:#555;">
                Color
            </label>
            <input type="text" id="patch-color" placeholder="e.g. Red"
                   style="width:100%; padding:10px; border:2px solid #ddd; 
                          border-radius:5px; font-size:1rem;">
        </div>

        
        <div style="background:#f8f9fa; border-radius:5px; padding:12px; 
                    margin-bottom:20px; border-left:4px solid #667eea;">
            <p style="font-size:0.8rem; color:#666; margin-bottom:5px; 
                      font-weight:600;">
                PATCH request preview:
            </p>
            <code id="patch-preview" style="font-size:0.8rem; color:#c0392b;">
                { }
            </code>
        </div>

        <div style="display:flex; gap:10px;">
            <button onclick="submitPatch()" 
                    style="flex:1; padding:12px; background:#667eea; 
                           color:white; border:none; border-radius:5px; 
                           font-size:1rem; font-weight:600; cursor:pointer;">
                Apply Changes
            </button>
            <button onclick="closeQuickEdit()"
                    style="flex:1; padding:12px; background:#6c757d; 
                           color:white; border:none; border-radius:5px; 
                           font-size:1rem; cursor:pointer;">
                Cancel
            </button>
        </div>
    </div>
</div>
<script src="stats.js"></script>
</body>
</html>
